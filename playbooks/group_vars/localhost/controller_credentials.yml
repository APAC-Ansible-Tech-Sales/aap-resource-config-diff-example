---
# Dummy credentials for Engineering CaC / idempotency testing.
# After first apply: re-run should report changed=0 unless you edit a field.
# Tip: update_secrets: false avoids "always changed" when AAP returns $encrypted$.
controller_credentials:
  - name: CaC Demo Machine
    description: Dummy machine credential for CaC demo
    organization: Engineering
    credential_type: Machine
    update_secrets: false
    inputs:
      username: cac-demo
      password: "{{ secret }}"
      become_method: sudo

  - name: CaC Demo Source Control
    description: Dummy SCM credential for public/private git demos
    organization: Engineering
    credential_type: Source Control
    update_secrets: false
    inputs:
      username: git-user
      password: "{{ secret }}"

  - name: CaC Demo Vault
    description: Dummy Ansible Vault credential
    organization: Engineering
    credential_type: Vault
    update_secrets: false
    inputs:
      vault_password: "{{ secret }}"

  - name: CaC Demo Registry
    description: Dummy container registry credential
    organization: Engineering
    credential_type: Container Registry
    update_secrets: false
    inputs:
      host: quay.io
      username: demo-user
      password: "{{ secret }}"
      verify_ssl: true
